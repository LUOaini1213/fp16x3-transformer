name: cpu-smoke

# Correctness of the optimized forward against the reference, on CPU, for
# every graded shape plus the padded fallback and the chunked path. Speed
# needs a GPU and lives in the Kaggle logs under results/; this only asks
# whether the answer moved.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest
      - name: Shapes 1-13 + padded fallback (shipped defaults)
        run: python scripts/smoke_cpu.py
      - name: Chunked output path and every opt-in flag still exact
        run: |
          T3_CHUNK_BS=3 python scripts/smoke_cpu.py
          T3_FUSED_QKV=1 python scripts/smoke_cpu.py
          T3_TRITON=1 T3_ATTN=triton python scripts/smoke_cpu.py
          T3_LINEAR=fp16x3 python scripts/smoke_cpu.py
          T3_LINEAR=fp32 python scripts/smoke_cpu.py
          T3_ATTN=turing python scripts/smoke_cpu.py
          T3_X3_BLAS=lt python scripts/smoke_cpu.py
      - name: fp16x3 unit tests (exact CPU emulation)
        run: python -m pytest -q tests/
      - name: One-command entry point and explicit runtime profiles
        run: |
          python -m scripts.run --check-only --device cpu --output /tmp/doctor.json
          python -m scripts.run --mode quick --device cpu --shape 2 --repeats 1 --output /tmp/quick.json
          python -m scripts.run --mode balanced --device cpu --shape 2 --repeats 1 --output /tmp/balanced.json
          python -m scripts.run --mode steady --device cpu --shape 2 --repeats 1 --output /tmp/steady.json
