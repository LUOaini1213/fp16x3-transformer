name: cpu-smoke

# Correctness of the optimized forward against the reference, on CPU, for
# graded shapes 1-5 and 7-13 (shape 6 is B=10000 and shape 14 is infeasible on
# CPU) plus the padded fallback and the chunked path. On CPU the Triton
# kernels, the compensated cuBLAS GEMM and the Turing attention backend are
# unavailable, so the opt-in flags below only show that they fall back
# cleanly; the compensated arithmetic is covered by the exact CPU emulation
# tests. Speed and real-GPU kernel behaviour need a GPU and live in the
# recorded Kaggle T4 artifacts, which this job audits by hash.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest
      - name: Shapes 1-5, 7-13 + padded fallback on CPU (shipped defaults)
        run: python scripts/smoke_cpu.py
      - name: Chunked output path exact; opt-in GPU flags fall back cleanly on CPU
        run: |
          T3_CHUNK_BS=3 python scripts/smoke_cpu.py
          T3_FUSED_QKV=1 python scripts/smoke_cpu.py
          T3_TRITON=1 T3_ATTN=triton python scripts/smoke_cpu.py
          T3_LINEAR=fp16x3 python scripts/smoke_cpu.py
          T3_LINEAR=fp32 python scripts/smoke_cpu.py
          T3_ATTN=turing python scripts/smoke_cpu.py
          T3_X3_BLAS=lt python scripts/smoke_cpu.py
      - name: Unit tests, fp16x3 CPU emulation and README/report number checks
        run: python -m pytest -q tests/
      - name: Complete GPU evidence receipts, current sources and runtime report
        run: python -m scripts.verify_next_evidence --maintained-runtime
      - name: One-command entry point and explicit runtime profiles
        run: |
          python -m scripts.run --check-only --device cpu --output /tmp/doctor.json
          python -m scripts.run --mode quick --device cpu --shape 2 --repeats 1 --output /tmp/quick.json
          python -m scripts.run --mode balanced --device cpu --shape 2 --repeats 1 --output /tmp/balanced.json
          python -m scripts.run --mode steady --device cpu --shape 2 --repeats 1 --output /tmp/steady.json
